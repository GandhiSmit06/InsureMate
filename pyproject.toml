[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "insuremate"
version = "0.2.0"
description = "InsureMate — AI-Based Insurance Claim Preparation Agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "python-dateutil>=2.8.2",
    "pymupdf>=1.24.0",
    "numpy>=1.24.0,<2.4.0",
]

[project.optional-dependencies]
ocr = [
    "paddleocr>=2.7.0",
    "paddlepaddle>=3.0.0",
    "opencv-python>=4.8.0",
    "pillow>=10.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.pytest.ini_options]
testpaths = ["AI/tests"]
pythonpath = ["."]
