<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 168" width="160" height="168" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">InsureMate</title>
  <defs>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4DA8FF"/>
      <stop offset="1" stop-color="#1F6FEB"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0.8"/>
    </linearGradient>
    <clipPath id="docClip"><rect x="56" y="44" width="48" height="62" rx="6"/></clipPath>
  </defs>
  <style>
        .shield { transform-origin: 80px 82px; animation: breathe 6s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.025); } }
    .orbit { transform-origin: 80px 82px; animation: spin 12s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .scanbar { animation: sweep 6s ease-in-out infinite; }
    @keyframes sweep { 0% { transform: translateY(-20px); opacity: 0; } 5% { opacity: 1; } 55% { transform: translateY(70px); opacity: 1; } 62%,100% { transform: translateY(70px); opacity: 0; } }
    .check { stroke-dasharray: 14; stroke-dashoffset: 14; }
    .c1 { animation: draw1 6s ease-out infinite; }
    .c2 { animation: draw2 6s ease-out infinite; }
    @keyframes draw1 { 0%,12% { stroke-dashoffset: 14; } 20%,90% { stroke-dashoffset: 0; } 97%,100% { stroke-dashoffset: 14; } }
    @keyframes draw2 { 0%,28% { stroke-dashoffset: 14; } 36%,90% { stroke-dashoffset: 0; } 97%,100% { stroke-dashoffset: 14; } }
    .flag { transform-origin: 66px 94px; opacity: 0; animation: flag 6s ease-in-out infinite; }
    @keyframes flag { 0%,44% { opacity: 0; transform: scale(0.4); } 52% { opacity: 1; transform: scale(1.25); } 58%,70% { opacity: 1; transform: scale(1); } 76% { transform: scale(1.18); } 82%,90% { opacity: 1; transform: scale(1); } 97%,100% { opacity: 0; transform: scale(0.4); } }
    .line { opacity: 0.45; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .check { stroke-dashoffset: 0; } .flag { opacity: 1; } .scanbar { opacity: 0; } }
  </style>
  <g transform="translate(0,4)">
    <g class="orbit">
      <circle cx="80" cy="82" r="72" fill="none" stroke="#4DA8FF" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="3 7"/>
      <circle cx="80" cy="10" r="4.5" fill="#38BDF8"/>
    </g>
    <g class="shield">
      <path d="M80 18 L128 35 V80 C128 110 108 130 80 142 C52 130 32 110 32 80 V35 Z" fill="url(#shield)"/>
      <path d="M80 18 L128 35 V80 C128 110 108 130 80 142 C52 130 32 110 32 80 V35 Z" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="2"/>
      <rect x="56" y="44" width="48" height="62" rx="6" fill="#FFFFFF"/>
      <path d="M92 44 L104 56 H96 a4 4 0 0 1 -4 -4 Z" fill="#CBD5E1"/>
      <circle cx="66" cy="66" r="5" fill="#DCFCE7"/>
      <path class="check c1" d="M63.3 66.2 L65.6 68.5 L69.2 63.9" fill="none" stroke="#16A34A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect class="line" x="75" y="64.5" width="22" height="3" rx="1.5" fill="#1D6FE0"/>
      <circle cx="66" cy="80" r="5" fill="#DCFCE7"/>
      <path class="check c2" d="M63.3 80.2 L65.6 82.5 L69.2 77.9" fill="none" stroke="#16A34A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect class="line" x="75" y="78.5" width="18" height="3" rx="1.5" fill="#1D6FE0"/>
      <circle cx="66" cy="94" r="5" fill="#FEE2E2"/>
      <g class="flag">
        <circle cx="66" cy="94" r="5.5" fill="#EF4444"/>
        <rect x="65.1" y="90.6" width="1.8" height="4.2" rx="0.9" fill="#fff"/>
        <circle cx="66" cy="97" r="1" fill="#fff"/>
      </g>
      <rect class="line" x="75" y="92.5" width="20" height="3" rx="1.5" fill="#1D6FE0"/>
      <g clip-path="url(#docClip)">
        <g class="scanbar">
          <rect x="56" y="44" width="48" height="16" fill="url(#scan)"/>
          <rect x="56" y="59" width="48" height="2" fill="#1D8FFF"/>
        </g>
      </g>
    </g>
  </g>
</svg>
