<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240" role="img" aria-label="InsureMate — Autonomous Insurance Claim Preparation &amp; Evidence Audit Agent">
  <defs>
    <!-- Shield Gradients -->
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <!-- Scan Bar Gradient -->
    <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Laser Divider Gradient -->
    <linearGradient id="laserGradLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0"/>
      <stop offset="30%" stop-color="#2563EB" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="1"/>
      <stop offset="70%" stop-color="#2563EB" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="laserGradDark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="30%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#60A5FA" stop-opacity="1"/>
      <stop offset="70%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>

    <!-- Document Clip -->
    <clipPath id="docClip">
      <rect x="56" y="44" width="48" height="62" rx="6"/>
    </clipPath>
  </defs>

  <style>
    text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", Helvetica, Arial, sans-serif;
    }

    /* Core Shield Animations */
    .shield {
      transform-origin: 80px 82px;
      animation: breathe 6s ease-in-out infinite;
    }
    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.028); }
    }

    .orbit {
      transform-origin: 80px 82px;
      animation: spin 12s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .scanbar {
      animation: sweep 6s ease-in-out infinite;
    }
    @keyframes sweep {
      0% { transform: translateY(-20px); opacity: 0; }
      5% { opacity: 1; }
      55% { transform: translateY(70px); opacity: 1; }
      62%, 100% { transform: translateY(70px); opacity: 0; }
    }

    .check {
      stroke-dasharray: 14;
      stroke-dashoffset: 14;
    }
    .c1 { animation: draw1 6s ease-out infinite; }
    .c2 { animation: draw2 6s ease-out infinite; }
    @keyframes draw1 {
      0%, 12% { stroke-dashoffset: 14; }
      20%, 90% { stroke-dashoffset: 0; }
      97%, 100% { stroke-dashoffset: 14; }
    }
    @keyframes draw2 {
      0%, 28% { stroke-dashoffset: 14; }
      36%, 90% { stroke-dashoffset: 0; }
      97%, 100% { stroke-dashoffset: 14; }
    }

    .flag {
      transform-origin: 66px 94px;
      opacity: 0;
      animation: flag 6s ease-in-out infinite;
    }
    @keyframes flag {
      0%, 44% { opacity: 0; transform: scale(0.4); }
      52% { opacity: 1; transform: scale(1.25); }
      58%, 70% { opacity: 1; transform: scale(1); }
      76% { transform: scale(1.18); }
      82%, 90% { opacity: 1; transform: scale(1); }
      97%, 100% { opacity: 0; transform: scale(0.4); }
    }

    .line { opacity: 0.45; }

    /* Subtle Laser Line Pulse */
    .laser-line {
      animation: pulseLaser 4s ease-in-out infinite alternate;
    }
    @keyframes pulseLaser {
      0% { opacity: 0.5; stroke-width: 1.2; }
      100% { opacity: 1; stroke-width: 2.2; }
    }

    /* Light Theme (Default) */
    .brand-insure { fill: #0F172A; }
    .brand-mate { fill: #2563EB; }
    .brand-sub { fill: #475569; }
    .laser-line { stroke: url(#laserGradLight); }

    /* Dark Theme Support via CSS Media Query */
    @media (prefers-color-scheme: dark) {
      .brand-insure { fill: #F8FAFC !important; }
      .brand-mate { fill: #38BDF8 !important; }
      .brand-sub { fill: #94A3B8 !important; }
      .laser-line { stroke: url(#laserGradDark) !important; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .check { stroke-dashoffset: 0; }
      .flag { opacity: 1; }
      .scanbar { opacity: 0; }
    }
  </style>

  <!-- Centered Logo Group (Offset: 320 to center 160 width in 800) -->
  <g transform="translate(320, 6)">
    <!-- Orbit Track & Satellite -->
    <g class="orbit">
      <circle cx="80" cy="82" r="72" fill="none" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="3 7"/>
      <circle cx="80" cy="10" r="4.5" fill="#38BDF8"/>
    </g>

    <!-- Shield & Extracted Document -->
    <g class="shield">
      <!-- Outer Shield Path with Drop Shadow -->
      <path d="M80 18 L128 35 V80 C128 110 108 130 80 142 C52 130 32 110 32 80 V35 Z" fill="url(#shieldGrad)"/>
      <path d="M80 18 L128 35 V80 C128 110 108 130 80 142 C52 130 32 110 32 80 V35 Z" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="2"/>

      <!-- Inner Paper Document -->
      <rect x="56" y="44" width="48" height="62" rx="6" fill="#FFFFFF"/>
      <path d="M92 44 L104 56 H96 a4 4 0 0 1 -4 -4 Z" fill="#CBD5E1"/>

      <!-- Verified Checkmark Item 1 -->
      <circle cx="66" cy="66" r="5" fill="#DCFCE7"/>
      <path class="check c1" d="M63.3 66.2 L65.6 68.5 L69.2 63.9" fill="none" stroke="#16A34A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect class="line" x="75" y="64.5" width="22" height="3" rx="1.5" fill="#1D6FE0"/>

      <!-- Verified Checkmark Item 2 -->
      <circle cx="66" cy="80" r="5" fill="#DCFCE7"/>
      <path class="check c2" d="M63.3 80.2 L65.6 82.5 L69.2 77.9" fill="none" stroke="#16A34A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect class="line" x="75" y="78.5" width="18" height="3" rx="1.5" fill="#1D6FE0"/>

      <!-- Discrepancy Flag Item 3 -->
      <circle cx="66" cy="94" r="5" fill="#FEE2E2"/>
      <g class="flag">
        <circle cx="66" cy="94" r="5.5" fill="#EF4444"/>
        <rect x="65.1" y="90.6" width="1.8" height="4.2" rx="0.9" fill="#FFFFFF"/>
        <circle cx="66" cy="97" r="1" fill="#FFFFFF"/>
      </g>
      <rect class="line" x="75" y="92.5" width="20" height="3" rx="1.5" fill="#1D6FE0"/>

      <!-- Scanning Laser Bar -->
      <g clip-path="url(#docClip)">
        <g class="scanbar">
          <rect x="56" y="44" width="48" height="16" fill="url(#scanGrad)"/>
          <rect x="56" y="59" width="48" height="2" fill="#38BDF8"/>
        </g>
      </g>
    </g>
  </g>

  <!-- Brand Typography -->
  <text x="400" y="184" text-anchor="middle" font-size="42" font-weight="800" letter-spacing="-1.5">
    <tspan class="brand-insure">Insure</tspan><tspan class="brand-mate">Mate</tspan>
  </text>

  <!-- Subtitle -->
  <text x="400" y="210" text-anchor="middle" font-size="14.5" font-weight="500" class="brand-sub" letter-spacing="-0.01em">
    Autonomous Medical Insurance Claim Preparation &amp; Multi-Document Evidence Audit Agent
  </text>

  <!-- Animated Glowing Divider -->
  <line x1="260" y1="232" x2="540" y2="232" stroke-linecap="round" class="laser-line"/>
</svg>
