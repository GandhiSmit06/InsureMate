<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 86" width="800" height="86" role="img" aria-label="InsureMate Footer">
  <defs>
    <!-- Divider Gradients -->
    <linearGradient id="footerLineLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0"/>
      <stop offset="25%" stop-color="#2563EB" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="75%" stop-color="#2563EB" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="footerLineDark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="25%" stop-color="#38BDF8" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#60A5FA" stop-opacity="0.95"/>
      <stop offset="75%" stop-color="#38BDF8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="miniShieldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <style>
    text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", Helvetica, Arial, sans-serif;
    }

    .footer-line {
      animation: pulseLine 4s ease-in-out infinite alternate;
    }
    @keyframes pulseLine {
      0% { opacity: 0.45; stroke-width: 1.2; }
      100% { opacity: 0.95; stroke-width: 1.8; }
    }

    .mini-shield {
      transform-origin: 400px 22px;
      animation: floatShield 5s ease-in-out infinite alternate;
    }
    @keyframes floatShield {
      0% { transform: translateY(0); }
      100% { transform: translateY(-2.5px); }
    }

    .orbit-mini {
      transform-origin: 400px 22px;
      animation: spinMini 10s linear infinite;
    }
    @keyframes spinMini {
      to { transform: rotate(360deg); }
    }

    /* Light Theme (Default) */
    .footer-line { stroke: url(#footerLineLight); }
    .brand-insure-ft { fill: #0F172A; }
    .brand-mate-ft { fill: #2563EB; }
    .footer-sub-text { fill: #475569; }
    .footer-meta-text { fill: #64748B; }

    /* Dark Theme */
    @media (prefers-color-scheme: dark) {
      .footer-line { stroke: url(#footerLineDark) !important; }
      .brand-insure-ft { fill: #F8FAFC !important; }
      .brand-mate-ft { fill: #38BDF8 !important; }
      .footer-sub-text { fill: #94A3B8 !important; }
      .footer-meta-text { fill: #64748B !important; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <!-- Glowing Top Hairline Divider -->
  <line x1="160" y1="6" x2="640" y2="6" stroke-linecap="round" class="footer-line"/>

  <!-- Centered Mini Animated Shield Icon -->
  <g class="mini-shield">
    <!-- Mini Orbit -->
    <g class="orbit-mini">
      <circle cx="400" cy="22" r="16" fill="none" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="2 4"/>
      <circle cx="400" cy="6" r="2.2" fill="#38BDF8"/>
    </g>

    <!-- Mini Shield -->
    <path d="M400 10 L411 14 V24 C411 31 406 35 400 38 C394 35 389 31 389 24 V14 Z" fill="url(#miniShieldGrad)"/>
    <path d="M400 10 L411 14 V24 C411 31 406 35 400 38 C394 35 389 31 389 24 V14 Z" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1"/>
    
    <!-- Mini Document inside shield -->
    <rect x="395" y="16" width="10" height="13" rx="1.5" fill="#FFFFFF"/>
    <!-- Mini Green Checkmark -->
    <path d="M397.5 22.5 L399.2 24.2 L402.5 20.8" fill="none" stroke="#16A34A" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Centered Branding & Title -->
  <text x="400" y="58" text-anchor="middle" font-size="13.5" font-weight="600" letter-spacing="-0.01em">
    <tspan class="brand-insure-ft">Insure</tspan><tspan class="brand-mate-ft">Mate</tspan>
    <tspan class="footer-sub-text" font-weight="400"> · Autonomous Claim Adjudication &amp; Evidence Audit System</tspan>
  </text>

  <!-- Secondary Metadata -->
  <text x="400" y="75" text-anchor="middle" font-size="11" class="footer-meta-text">
    Track B: Agentic AI Application · MIT License · 100% Deterministic Grounding
  </text>
</svg>
