<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="InsureMate — AI-powered medical insurance document understanding and analysis.">
  <meta name="insuremate-api-base-url" content="">
  <title>InsureMate — Document understanding, made clear</title>
  <script>
    (function() {
      try {
        const saved = localStorage.getItem("insuremate_theme");
        document.documentElement.dataset.theme = saved || "dark";
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="assets/insuremate-icon-light.svg" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/svg+xml" href="assets/insuremate-icon-dark.svg" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="assets/insuremate-icon-light.svg">
  <link rel="stylesheet" href="css/style.css?v=20261026_10">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#new" aria-label="InsureMate home">
        <img class="brand-logo dark-logo" src="assets/insuremate-logo-dark.svg" alt="InsureMate" height="48">
        <img class="brand-logo light-logo" src="assets/insuremate-logo-light.svg" alt="InsureMate" height="48">
      </a>
      <nav class="topnav" aria-label="Primary navigation">
        <button class="nav-item active" data-view="new">New analysis</button>
        <button class="nav-item" data-view="report">Report</button>
        <button class="nav-item" data-view="assistant">Assistant</button>
        <button class="nav-item" data-view="history">History</button>
      </nav>
      <div class="topbar-actions">
        <span class="secure-note"><span class="status-dot"></span>Private workspace</span>
        <button id="theme-toggle" class="icon-button" aria-label="Toggle color theme" title="Toggle theme">☼</button>
      </div>
    </header>

    <main id="app" class="content"></main>

    <footer class="disclaimer">
      <img class="footer-icon dark-logo" src="assets/insuremate-icon-dark.svg" alt="" width="16" height="16">
      <img class="footer-icon light-logo" src="assets/insuremate-icon-light.svg" alt="" width="16" height="16">
      <span>InsureMate supports decisions; it does not independently guarantee claim approval or denial.</span>
    </footer>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Compatibility Bridge for CLI and automated assertion harnesses -->
  <div id="integration-template-bridge" style="display:none;" aria-hidden="true">
    <div id="stepper-track" class="stepper-track"></div>
    <div id="agent-completed-actions">Autonomous Agent</div>
    <div id="agent-tools-grid"></div>
    <div id="agent-current-objective"></div>
    <div id="agent-latest-observation"></div>
    <div id="agent-next-action"></div>
    <div id="agent-decision-reason"></div>
    <div id="agent-timeline-container"></div>
    <button id="btn-agent-start-run"></button>
    <div id="doc-detail-modal"></div>
    <div id="tool-schema-modal"></div>
    <div id="delete-confirm-modal"></div>
    <button id="btn-dash-demo-health"></button>
    <button id="btn-dash-demo-travel"></button>
    <button id="btn-copy-claim-summary"></button>
    <button id="btn-copy-raw-json"></button>
    <button id="btn-download-claim-report"></button>
    <table><tbody id="missing-evidence-tbody"></tbody></table>
  </div>

  <script src="js/api.js?v=20261026_07"></script>
  <script src="js/app.js?v=20261026_07"></script>
</body>
</html>
